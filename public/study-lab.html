<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZLAB — Course playground</title><style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
:root{--ink:#172c48;--blue:#2449e8;--paper:#fffef9;--pink:#ffc5df;--yellow:#ffe56b;--sky:#dce5ff;--lime:#ddf795}*{box-sizing:border-box}body{margin:0;background:#f0f1ed;color:var(--ink);font-family:'Be Vietnam Pro',sans-serif}button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{font:inherit;cursor:pointer}header{padding:22px 24px;background:var(--paper);border-bottom:1px solid #ddd;position:sticky;top:0;z-index:20}header strong{color:var(--blue);font-size:24px}header p{font-size:12px;margin:5px 0 14px}nav{display:flex;gap:8px;overflow:auto}nav button{padding:10px 16px;white-space:nowrap;border:1px solid #d8deeb;border-radius:30px;background:white;color:var(--ink);font-size:12px;min-height:44px}nav button[aria-pressed=true]{background:var(--blue);color:white;border-color:var(--blue)}main{max-width:430px;margin:24px auto 70px;background:var(--paper);padding:34px 22px 40px;overflow:hidden;border-radius:24px}h1{font-size:32px;letter-spacing:-1.4px;line-height:1.2;margin:0 0 14px}h1 em{font-style:normal;color:var(--blue)}.intro{font-size:13px;line-height:1.8;margin-bottom:30px;color:#64738b}.stage{padding:20px 4px}.card{position:relative;border-radius:24px;padding:22px;background:var(--sky);margin-bottom:18px;border:1px solid #172c4810;transition:transform .25s}.card:nth-child(2){background:var(--yellow)}.card:nth-child(3){background:var(--pink)}.mark{font-family:'Space Grotesk',sans-serif;font-size:42px;letter-spacing:-3px;font-weight:700;color:var(--blue);line-height:1}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.index{font-size:11px;border:1px solid currentColor;padding:5px 9px;border-radius:20px;opacity:.65}.card h2{font-size:21px;line-height:1.3;letter-spacing:-.7px;margin:0 0 10px}.card p{font-size:12px;line-height:1.8;margin:0 0 12px}.card ul{font-size:11px;line-height:1.9;padding-left:17px;margin:0 0 15px}.cta{border:0;border-top:1px solid #172c4820;background:transparent;width:100%;min-height:48px;text-align:left;display:flex;align-items:center;justify-content:space-between;color:var(--blue);font-weight:700;font-size:12px}.cta span{font-size:23px}.hint{font-size:11px;color:#64738b;line-height:1.8;margin-top:30px}.label{font-size:11px;display:block;margin-bottom:8px;color:#526078}.pyramid .card{margin-inline:auto;box-shadow:0 7px 0 #172c4812}.pyramid .card:nth-child(1){width:84%;transform:rotate(-3deg);z-index:3}.pyramid .card:nth-child(2){width:93%;transform:rotate(2deg);margin-top:-3px;z-index:2}.pyramid .card:nth-child(3){width:100%;transform:rotate(-1deg)}.toys .card{box-shadow:6px 7px 0 var(--ink);border:2px solid var(--ink);border-radius:18px;margin-bottom:28px}.toys .card:nth-child(1){transform:rotate(-4deg);margin-right:15px}.toys .card:nth-child(2){transform:rotate(4deg);margin-left:15px}.toys .card:nth-child(3){transform:rotate(-2deg);margin-right:8px}.toys .top:after{content:'';width:25px;height:25px;border-radius:50%;background:#ffffff80;box-shadow:-37px 0 #ffffff80;position:absolute;top:-14px;right:28px;border:2px solid var(--ink)}.toys .mark{background:var(--paper);padding:10px 13px;border-radius:12px;font-size:34px}.deck .card{border-radius:7px 25px 25px 25px;padding:22px 22px 16px;margin-bottom:12px}.deck .card:nth-child(2){margin-left:22px}.deck .card:nth-child(3){margin-right:22px}.deck .top{margin-bottom:10px}.deck .mark{font-size:30px}.deck .card h2{font-size:23px;max-width:245px}.deck .card ul{display:none}.deck .card p{font-size:13px}.deck .index{border:0;font-size:32px;opacity:.2;font-weight:800}.deck .card:nth-child(1){background:var(--blue);color:var(--paper)}.deck .card:nth-child(1) .mark,.deck .card:nth-child(1) .cta{color:var(--yellow)}.deck .card:nth-child(1) .label{color:var(--sky)}.deck .card:nth-child(1) .cta{border-color:#ffffff40}button:focus-visible{outline:3px solid var(--blue);outline-offset:4px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:14px 20px;border-radius:16px;font-size:12px;z-index:30;max-width:90%;width:max-content}.toast:empty{display:none}@media(min-width:700px){main{box-shadow:0 20px 60px #172c4812}header>div{max-width:1000px;margin:auto}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>
.card ul{display:none}.card .mark{font-size:32px;letter-spacing:-1.5px}.pyramid .card{width:100%!important;border-radius:3px 3px 22px 3px;box-shadow:3px 6px 0 #172c4812;margin-bottom:30px;transform:rotate(-2deg)!important;padding-top:32px}.pyramid .card:nth-child(2){transform:rotate(2deg)!important}.pyramid .card:before{content:'';position:absolute;top:-10px;left:calc(50% - 32px);width:64px;height:24px;background:#fff9;border:1px solid #172c4810;transform:rotate(-5deg)}.toys .card{transform:none!important;margin:0 0 20px!important;box-shadow:none;border:1px solid #172c4830;border-radius:18px;padding-bottom:12px}.toys .top:after{display:none}.toys .top{border-bottom:1px dashed #172c4850;padding-bottom:18px}.toys .card:before{content:'';position:absolute;left:-10px;top:85px;width:20px;height:20px;background:var(--paper);border-radius:50%}.toys .card:after{content:'';position:absolute;right:-10px;top:85px;width:20px;height:20px;background:var(--paper);border-radius:50%}.toys .mark{background:none;padding:0}.deck .card{margin:0!important;padding:20px 0 12px;border-radius:0;background:transparent!important;color:var(--ink)!important;border:0;border-bottom:1px solid #172c4820}.deck .card .mark{color:var(--blue)!important;font-size:18px;letter-spacing:-.5px}.deck .card .label{color:#64738b!important}.deck .card .cta{color:var(--blue)!important;border:0}.deck .top{margin-bottom:12px}.deck .index{font-size:14px;opacity:1;background:var(--yellow);padding:8px 10px;border-radius:4px}.deck .card h2{max-width:none;font-size:22px}.deck .card p{margin-bottom:2px}.deck .card:nth-child(2) .index{background:var(--pink)}.deck .card:nth-child(3) .index{background:var(--sky)}
</style><header><div><strong>ZLAB / Design lab</strong><p>3 hướng thiết kế Góc học tập · bản thử cho mobile</p><nav><button aria-pressed="true" data-style="pyramid">01 · Sticky notes</button><button aria-pressed="false" data-style="toys">02 · Study tickets</button><button aria-pressed="false" data-style="deck">03 · Reading list</button></nav></div></header><main><h1>Học một chút.<br><em>Mang theo mỗi ngày.</em></h1><p class="intro">Góc nhỏ cho những lần tự học.<br>Đọc nhanh, thử ngay bằng cách của bạn.</p><div class="stage pyramid" id="stage"></div><p class="hint" id="hint"></p></main><div class="toast" role="status"></div><script>
const courses=[['Say it.','Speaking · 3 phút đọc','Bí ý khi nói? Bắt đầu bằng một câu đơn giản.','Một công thức nhỏ để luyện diễn đạt mỗi ngày.',[]],['Words.','Từ vựng · 3 phút đọc','Đừng để từ mới chỉ nằm trong vở.','Biến một từ mới thành một câu chuyện của bạn.',[]],['Focus.','Góc tự học · 2 phút đọc','Một buổi học nhỏ, nhưng có đích đến.','Bớt mở quá nhiều tài liệu. Chọn một việc để làm xong.',[]]];
stage.innerHTML=courses.map((c,i)=>`<article class="card"><div class="top"><span class="mark">${c[0]}</span><span class="index">0${i+1}</span></div><span class="label">${c[1]}</span><h2>${c[2]}</h2><p>${c[3]}</p><ul>${c[4].map(t=>`<li>${t}</li>`).join('')}</ul><button class="cta" data-course="${c[2]}">Đọc bài ngắn <span>↗</span></button></article>`).join('');
const notes={pyramid:'01 / Giấy ghi chú có băng dính, nghiêng nhẹ. Mỗi bài là một ý tưởng mang theo.',toys:'02 / Vé bài học với đường xé và số thứ tự. Vui, gọn và đồng bộ tinh thần Toy blocks.',deck:'03 / Danh sách đọc gọn với dấu trang màu. Dễ lướt và ít chiếm chiều cao nhất.'};hint.textContent=notes.pyramid;
document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',x===b));stage.className='stage '+b.dataset.style;hint.textContent=notes[b.dataset.style];history.replaceState(null,'','#'+b.dataset.style)});
let timer;document.querySelectorAll('.cta').forEach(b=>b.onclick=()=>{document.querySelector('.toast').textContent=b.dataset.course+' — nút demo giao diện';clearTimeout(timer);timer=setTimeout(()=>document.querySelector('.toast').textContent='',2400)});const selected=document.querySelector(`[data-style="${location.hash.slice(1)}"]`);if(selected)selected.click();
</script></html>
